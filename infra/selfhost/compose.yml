# Olive Trees: Macro on one server, without AWS. See docs/ota/plan-phase-0.md.
#
# Every container joins the `backend` network under the hostname the generated
# env (cargo x) expects: postgres, redis, search, kafka, fusionauth, localstack
# (the AWS gateway) and each service's hyphenated name. Services keep the
# compose names of docker/docker-compose.yml as their own names, so routes and
# URLs written for the local stack resolve too. Only `proxy` (the public Caddy,
# ports 80 and 443) publishes a public port; the AWS gateway listens on
# 127.0.0.1:4566 for provisioning.
#
# Secrets come from the environment file the render step writes on the server
# (`--env-file /etc/macro/selfhost.env`, also every service's env_file); the
# `:?` guards stop compose when one is missing instead of starting with an
# empty password. Images come from GHCR (the `selfhost-images` workflow),
# pinned with MACRO_VERSION, a commit SHA.
name: macro-selfhost

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"
  networks:
    - backend

x-env-file: &env-file
  env_file:
    - ${MACRO_SELFHOST_DIR:-/etc/macro}/selfhost.env

# One image for every Rust service; each picks its binary.
x-rust: &rust
  <<: [*defaults, *env-file]
  image: ${MACRO_REGISTRY:-ghcr.io/olivierverhaegen}/macro-rust:${MACRO_VERSION:?set to the image commit}
  depends_on:
    migrate:
      condition: service_completed_successfully

# A Lambda handler: the Rust image, run by the Lambda host from its pdfium-ready
# working directory.
x-lambda: &lambda
  <<: *rust
  working_dir: /app

services:
  postgres:
    <<: *defaults
    image: pgvector/pgvector:pg18
    command: postgres -c max_connections=500
    environment:
      POSTGRES_USER: macro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in the selfhost env file}
      POSTGRES_DB: macrodb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro -d macrodb"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      # pg18+ keeps PGDATA in a version-specific subdirectory of this mount.
      - postgres:/var/lib/postgresql

  redis:
    <<: *defaults
    image: redis/redis-stack-server:7.4.0-v3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redis:/data

  kafka:
    <<: *defaults
    # Same broker as the local stack (single-node KRaft) so topics and client
    # settings behave identically; Redpanda can replace it later to save memory.
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      # A fixed cluster id lets the volume survive container recreation.
      CLUSTER_ID: T2xpdmVUcmVlc01hY3JvMQ
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
    volumes:
      - kafka:/var/lib/kafka/data

  search:
    <<: *defaults
    # The local stack's image: OpenSearch 3.5 with analysis-icu, which the
    # channels index needs.
    build:
      context: ../local/opensearch
    image: macro-selfhost-opensearch:3.5.0
    environment:
      cluster.name: search
      discovery.type: single-node
      node.name: search
      # Only the backend network reaches it; there is no public route.
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?set in the selfhost env file}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: curl --fail --silent --output /dev/null http://localhost:9200/
      interval: 10s
      retries: 60
    volumes:
      - opensearch:/usr/share/opensearch/data

  fusionauth-db:
    <<: *defaults
    image: postgres:16.0-bookworm
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FUSIONAUTH_DB_PASSWORD:?set in the selfhost env file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fusionauth-db:/var/lib/postgresql/data

  fusionauth:
    <<: *defaults
    image: fusionauth/fusionauth-app:1.62.1
    init: true
    depends_on:
      fusionauth-db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://fusionauth-db:5432/fusionauth
      DATABASE_ROOT_USERNAME: postgres
      DATABASE_ROOT_PASSWORD: ${FUSIONAUTH_DB_PASSWORD:?set in the selfhost env file}
      DATABASE_USERNAME: fusionauth
      DATABASE_PASSWORD: ${FUSIONAUTH_DB_PASSWORD:?set in the selfhost env file}
      # The render step writes a kickstart with this server's own secrets.
      FUSIONAUTH_APP_KICKSTART_FILE: /usr/local/fusionauth/kickstart/kickstart.json
      FUSIONAUTH_APP_MEMORY: 512M
      FUSIONAUTH_APP_RUNTIME_MODE: production
      FUSIONAUTH_APP_URL: http://fusionauth:9011
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9011/api/status | grep -q '\"status\":\"Ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - fusionauth-config:/usr/local/fusionauth/config
      - ${MACRO_SELFHOST_DIR:-/etc/macro}/kickstart:/usr/local/fusionauth/kickstart:ro

  # --- AWS replacements, behind one endpoint ---------------------------------
  # The services know one AWS endpoint (LOCAL_AWS_URL). The gateway answers on
  # it as `localstack:4566` and routes each request to its emulator.
  aws-gateway:
    <<: *defaults
    image: caddy:2.10-alpine
    networks:
      backend:
        aliases:
          - localstack
    # Loopback only, for provision.sh on the server itself.
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./aws-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - sqs
      - dynamodb
      - kms
      - upload-relay

  sqs:
    <<: *defaults
    image: softwaremill/elasticmq-native:1.7.1
    # The image's user cannot write to a fresh named volume.
    user: root
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
      - sqs:/data

  dynamodb:
    <<: *defaults
    image: amazon/dynamodb-local:3.3.2
    # The image's user cannot write to a fresh named volume.
    user: root
    working_dir: /home/dynamodblocal
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    volumes:
      - dynamodb:/data

  kms:
    <<: *defaults
    image: nsmithuk/local-kms:3.12.0
    environment:
      PORT: "8080"
      # Keys must outlive restarts, or what they encrypted is lost for good.
      KMS_DATA_PATH: /data
    volumes:
      - kms:/data

  # The S3 store (garage/garage.toml). It checks every signature: the services
  # sign with LOCAL_AWS_* (macro_aws_config), and the upload relay forwards or
  # signs public requests. Keys are flat, as on S3. provision.sh sets up the
  # node and the services' key.
  garage:
    <<: *defaults
    image: dxflrs/garage:v2.1.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set in the selfhost env file}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set in the selfhost env file}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # --- Macro services ---------------------------------------------------------
  # MacroDB migrations, as the local stack runs them (sqlx-cli). Every Rust
  # service waits for it; rerun with `up migrate` after an upgrade.
  migrate:
    <<: [*defaults, *env-file]
    image: ${MACRO_REGISTRY:-ghcr.io/olivierverhaegen}/macro-rust:${MACRO_VERSION:?set to the image commit}
    restart: "no"
    working_dir: /app
    command: ["sh", "-c", "/app/out/sqlx database create && /app/out/sqlx migrate run --source /app/migrations"]
    depends_on:
      postgres:
        condition: service_healthy

  authentication-service:
    <<: *rust
    command: ["/app/out/authentication_service"]
  connection_gateway:
    <<: *rust
    command: ["/app/out/connection_gateway_service"]
    networks:
      backend:
        aliases:
          - connection-gateway
  contacts_service:
    <<: *rust
    command: ["/app/out/contacts_service"]
    networks:
      backend:
        aliases:
          - contacts-service
  document_storage_service:
    <<: *rust
    command: ["/app/out/document_storage_service"]
    environment:
      OVERRIDE_SYNC_SERVICE_URL: http://sync-service:8787
      OVERRIDE_LEXICAL_SERVICE_URL: http://lexical-service:8096
    networks:
      backend:
        aliases:
          - document-storage-service
  document_upload_finalizer:
    <<: *rust
    command: ["/app/out/document_upload_finalizer_local_worker"]
  email_service:
    <<: *rust
    command: ["/app/out/email_service"]
    networks:
      backend:
        aliases:
          - email-service
  email_pubsub_workers:
    <<: *rust
    command: ["/app/out/pubsub_workers"]
  calendar_service:
    <<: *rust
    command: ["/app/out/calendar_service"]
    networks:
      backend:
        aliases:
          - calendar-service
  notification_service:
    <<: *rust
    command: ["/app/out/notification_service"]
    environment:
      LAST_ONLINE_REDIS_URI: redis://redis:6379
      OVERRIDE_CONNECTION_GATEWAY_URL: http://connection-gateway:8080
    networks:
      backend:
        aliases:
          - notification-service
  search_processing_service:
    <<: *rust
    command: ["/app/out/search_processing_service"]
    environment:
      OVERRIDE_LEXICAL_SERVICE_URL: http://lexical-service:8096
    networks:
      backend:
        aliases:
          - search-processing-service
  agent_harness_service:
    <<: *rust
    command: ["/app/out/agent_harness_service"]
    environment:
      OVERRIDE_CONNECTION_GATEWAY_URL: http://connection-gateway:8080
      OVERRIDE_LEXICAL_SERVICE_URL: http://lexical-service:8096
      OVERRIDE_SYNC_SERVICE_URL: http://sync-service:8787
    networks:
      backend:
        aliases:
          - agent-harness-service
    # Agent sandboxes run as sibling containers on the host's daemon, as in the
    # local stack. The socket gives this container control of the host's Docker.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  static_file_service:
    <<: *rust
    command: ["/app/out/static_file_service"]
    networks:
      backend:
        aliases:
          - static-file-service
  unfurl_service:
    <<: *rust
    command: ["/app/out/unfurl_service"]
    networks:
      backend:
        aliases:
          - unfurl-service
  image_proxy_service:
    <<: *rust
    command: ["/app/out/image_proxy_service"]
    networks:
      backend:
        aliases:
          - image-proxy-service

  # --- Lambda handlers -------------------------------------------------------
  # Each runs its binary unchanged under lambda-host/host.py, which serves it the
  # Lambda Runtime API and turns its production triggers into invocations
  # (SOURCES: schedules, SQS queues, the upload relay's S3 events, HTTP). The
  # service name is the function name: the AWS gateway routes Lambda Invoke
  # calls to `<name>:9001`. Not here, because nothing on this server can trigger
  # them: dataloss_prevention_handler (reads Macro's S3 access logs) and
  # email_suppression_handler (SES bounces for macro.com).

  # rate(1 minute): sends that are due and recovery of stuck ones.
  email-scheduled-handler:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/email_scheduled_handler"]
    environment:
      FUNCTION_NAME: email-scheduled-handler
      TIMEOUT_SECONDS: "120"
      SOURCES: '[{"type": "schedule", "every": 60}]'
    networks:
      backend:
        aliases:
          - email-scheduled-handler

  # rate(4 hours): purges items deleted more than 30 days ago.
  deleted-item-poller:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/deleted_item_poller"]
    environment:
      FUNCTION_NAME: deleted-item-poller
      TIMEOUT_SECONDS: "120"
      SOURCES: '[{"type": "schedule", "every": 14400}]'
    networks:
      backend:
        aliases:
          - deleted-item-poller

  # rate(5 minutes), in dry-run mode as in production: it only logs what it
  # would delete. Set the input to {"dry_run": false} to enforce retention.
  notification-retention-handler:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/notification_retention_handler"]
    environment:
      FUNCTION_NAME: notification-retention-handler
      TIMEOUT_SECONDS: "120"
      SOURCES: '[{"type": "schedule", "every": 300, "input": {"dry_run": true}}]'
    networks:
      backend:
        aliases:
          - notification-retention-handler

  # rate(1 day): queues retention jobs per organization policy.
  organization-retention-trigger:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/organization_retention_trigger"]
    environment:
      FUNCTION_NAME: organization-retention-trigger
      TIMEOUT_SECONDS: "60"
      SOURCES: '[{"type": "schedule", "every": 86400}]'
    networks:
      backend:
        aliases:
          - organization-retention-trigger

  # Consumes those jobs.
  organization-retention-handler:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/organization_retention_handler"]
    environment:
      FUNCTION_NAME: organization-retention-handler
      TIMEOUT_SECONDS: "60"
      SOURCES: '[{"type": "sqs", "queue": "http://localstack:4566/000000000000/organization-retention-handler-queue", "batch": 1}]'
    networks:
      backend:
        aliases:
          - organization-retention-handler

  # rate(8 hours): removes unfinished account links older than a day.
  user-link-cleanup-handler:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/user_link_cleanup_handler"]
    environment:
      FUNCTION_NAME: user-link-cleanup-handler
      TIMEOUT_SECONDS: "120"
      SOURCES: '[{"type": "schedule", "every": 28800}]'
    networks:
      backend:
        aliases:
          - user-link-cleanup-handler

  # cron(0 8 * * ? *): removes orphaned email attachment files.
  email-sfs-delete-handler:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/email_sfs_delete_handler"]
    environment:
      FUNCTION_NAME: email-sfs-delete-handler
      TIMEOUT_SECONDS: "120"
      SOURCES: '[{"type": "schedule", "every": 86400, "offset": 28800}]'
    networks:
      backend:
        aliases:
          - email-sfs-delete-handler

  # rate(1 hour): renews Gmail push subscriptions and checks inbox health
  # (production values). Without Gmail inboxes it finds nothing to do.
  email-refresh-handler:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/email_refresh_handler"]
    environment:
      FUNCTION_NAME: email-refresh-handler
      TIMEOUT_SECONDS: "120"
      SOURCES: '[{"type": "schedule", "every": 3600}]'
      DELETE_UNUSED_AFTER_DAYS: "7"
      DELETE_INACTIVE_AFTER_DAYS: "60"
      INBOX_HEALTH_POLL_INTERVAL_HOURS: "6"
    networks:
      backend:
        aliases:
          - email-refresh-handler

  # Permanently deletes chats marked deleted.
  delete-chat-handler:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/delete_chat_handler"]
    environment:
      FUNCTION_NAME: delete-chat-handler
      TIMEOUT_SECONDS: "60"
      SOURCES: '[{"type": "sqs", "queue": "http://localstack:4566/000000000000/delete-chat-handler-queue", "batch": 1}]'
    networks:
      backend:
        aliases:
          - delete-chat-handler

  # Word uploads (docx-upload bucket) into documents. On a failure it tells a
  # websocket Lambda that does not exist here; that call fails and is logged.
  docx-unzip-handler:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/docx_unzip_handler"]
    environment:
      FUNCTION_NAME: docx-unzip-handler
      TIMEOUT_SECONDS: "300"
      SOURCES: '[{"type": "s3", "queue": "http://localstack:4566/000000000000/selfhost-docx-unzip-events"}]'
      WEB_SOCKET_RESPONSE_LAMBDA: "job-update-handler"
    networks:
      backend:
        aliases:
          - docx-unzip-handler

  # Text and citations of uploaded documents, for search and AI; the same
  # EventBridge events as in production, plus its own queue.
  document-text-extractor:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/document_text_extractor"]
    environment:
      FUNCTION_NAME: document-text-extractor
      TIMEOUT_SECONDS: "300"
      SOURCES: '[{"type": "s3-eventbridge", "queue": "http://localstack:4566/000000000000/selfhost-text-extractor-events"}, {"type": "sqs", "queue": "http://localstack:4566/000000000000/document-text-extractor-lambda-queue", "batch": 1}]'
    networks:
      backend:
        aliases:
          - document-text-extractor

  # Hands every new document version to search indexing.
  search-upload-handler:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/search_upload_handler"]
    environment:
      FUNCTION_NAME: search-upload-handler
      TIMEOUT_SECONDS: "60"
      SOURCES: '[{"type": "s3-eventbridge", "queue": "http://localstack:4566/000000000000/selfhost-search-upload-events"}]'
    networks:
      backend:
        aliases:
          - search-upload-handler

  # Image variants (`/static-file/file/<id>?size=N`, see proxy/Caddyfile). It
  # resizes in the background by invoking itself through the AWS gateway.
  image-optimizer:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/image_optimizer"]
    environment:
      FUNCTION_NAME: image-optimizer
      TIMEOUT_SECONDS: "30"
      SOURCES: '[{"type": "http", "port": 8080}]'
      BUCKET: "static-file-storage"
    networks:
      backend:
        aliases:
          - image-optimizer

  # Bulk uploads: queues each zip that lands in bulk-upload-staging.
  upload-extractor-lambda-trigger:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/upload_extractor_lambda_trigger"]
    environment:
      FUNCTION_NAME: upload-extractor-lambda-trigger
      TIMEOUT_SECONDS: "60"
      SOURCES: '[{"type": "s3-eventbridge", "queue": "http://localstack:4566/000000000000/selfhost-upload-extractor-events"}]'
      DYNAMODB_TABLE: "bulk-upload"
    networks:
      backend:
        aliases:
          - upload-extractor-lambda-trigger

  # Unpacks those zips into documents.
  upload-extractor-lambda-handler:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/upload_extractor_lambda_handler"]
    environment:
      FUNCTION_NAME: upload-extractor-lambda-handler
      TIMEOUT_SECONDS: "300"
      SOURCES: '[{"type": "sqs", "queue": "http://localstack:4566/000000000000/bulk-upload-queue", "batch": 1}]'
      DYNAMODB_TABLE: "bulk-upload"
      UPLOAD_BUCKET_NAME: "bulk-upload-staging"
      DSS_URL: "http://document-storage-service:8080"
      CONNECTION_GATEWAY_URL: "http://connection-gateway:8080"
    networks:
      backend:
        aliases:
          - upload-extractor-lambda-handler

  # Preview images of call recordings (calls/*.mp4).
  call-recording-preview-handler:
    <<: *lambda
    command: ["python3", "/app/lambda-host/host.py", "--", "/app/out/call_recording_preview_handler"]
    environment:
      FUNCTION_NAME: call-recording-preview-handler
      TIMEOUT_SECONDS: "300"
      SOURCES: '[{"type": "s3", "queue": "http://localstack:4566/000000000000/selfhost-call-recording-events"}]'
      FFMPEG_PATH: "/usr/bin/ffmpeg"
      FFPROBE_PATH: "/usr/bin/ffprobe"
    networks:
      backend:
        aliases:
          - call-recording-preview-handler

  # Replaces worker_trigger, which starts this as an ECS task every hour.
  sha-cleanup-worker:
    <<: *rust
    command: ["sh", "-c", "while :; do /app/out/sha_cleanup_worker; sleep 3600; done"]

  # EventBridge rules whose target is a queue rather than a Lambda: the same
  # messages on the same schedules (scheduler/scheduler.py).
  scheduler:
    <<: *defaults
    image: python:3.13-alpine3.22
    command: ["python", "/scheduler/scheduler.py"]
    environment:
      SCHEDULES: '[{"name": "reminder-sweep", "every": 60, "queue": "http://localstack:4566/000000000000/reminder-dispatch-queue", "body": {"operation": "sweep"}}, {"name": "calendar-reminder-sweep", "every": 60, "queue": "http://localstack:4566/000000000000/calendar-reminder-dispatch-queue", "body": {"operation": "sweep"}}, {"name": "crm-cleanup", "every": 86400, "offset": 28800, "queue": "http://localstack:4566/000000000000/email-service-crm-cleanup-queue", "body": {"operation": "start_job"}}]'
    volumes:
      - ./scheduler/scheduler.py:/scheduler/scheduler.py:ro
    depends_on:
      - aws-gateway

  # Office documents (docx, xlsx, legacy formats) into Macro documents with
  # LibreOfficeKit, from the convert queue; its own image (docker/Dockerfile.convert_service).
  convert_service:
    <<: [*defaults, *env-file]
    image: ${MACRO_REGISTRY:-ghcr.io/olivierverhaegen}/macro-convert:${MACRO_VERSION:?set to the image commit}
    environment:
      LOK_PATH: /app/lok/instdir/program
      WEB_SOCKET_RESPONSE_LAMBDA: job-update-handler
    networks:
      backend:
        aliases:
          - convert-service
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Garage sends no SQS bucket notifications and serves no public reads. The
  # relay sits in front of it: it sends the buckets' ObjectCreated events, and
  # on its public port (8081, for the public Caddy) it lets through only valid
  # presigned requests, plus reads of the static-file bucket, which it signs.
  upload-relay:
    # The AWS key comes from the env file, not interpolation: a shell's own
    # variables would win there.
    <<: [*defaults, *env-file]
    image: python:3.13-alpine3.22
    command: ["python", "/relay/relay.py"]
    environment:
      S3_UPSTREAM: garage:3900
      # The bucket notifications of production: the upload finalizer, text
      # extraction and search for documents, Word and bulk uploads, call
      # recordings, and static file metadata.
      NOTIFY: >-
        doc-storage=http://localstack:4566/000000000000/document-upload-finalizer-queue,
        doc-storage=http://localstack:4566/000000000000/selfhost-text-extractor-events,
        doc-storage=http://localstack:4566/000000000000/selfhost-search-upload-events,
        docx-upload=http://localstack:4566/000000000000/selfhost-docx-unzip-events,
        bulk-upload-staging=http://localstack:4566/000000000000/selfhost-upload-extractor-events,
        macro-call-recording-local/calls/*.mp4=http://localstack:4566/000000000000/selfhost-call-recording-events,
        static-file-storage=http://localstack:4566/000000000000/static-file-s3-event-notification-queue
      PUBLIC_READ: static-file-storage
    volumes:
      - ./upload-relay/relay.py:/relay/relay.py:ro
    depends_on:
      - garage

  sync_service:
    <<: [*defaults, *env-file]
    image: ${MACRO_REGISTRY:-ghcr.io/olivierverhaegen}/macro-sync:${MACRO_VERSION:?set to the image commit}
    environment:
      DOCUMENT_PERMISSIONS_SECRET: ${DOCUMENT_PERMISSION_JWT:?set in the selfhost env file}
      DSS_INTERNAL_AUTH_KEY: ${DOCUMENT_STORAGE_SERVICE_AUTH_KEY:?set in the selfhost env file}
      WRANGLER_SEND_METRICS: "false"
    networks:
      backend:
        aliases:
          - sync-service
    volumes:
      # The collaborative documents' live state (Durable Objects, D1, KV).
      - sync_state:/app/.wrangler/state

  lexical_service:
    <<: [*defaults, *env-file]
    image: ${MACRO_REGISTRY:-ghcr.io/olivierverhaegen}/macro-lexical:${MACRO_VERSION:?set to the image commit}
    environment:
      PORT: "8096"
      INTERNAL_AUTH_KEY: ${INTERNAL_API_SECRET_KEY:?set in the selfhost env file}
      SYNC_SERVICE_AUTH_KEY: ${INTERNAL_API_SECRET_KEY:?set in the selfhost env file}
      SYNC_SERVICE_URL: http://sync-service:8787
    networks:
      backend:
        aliases:
          - lexical-service

  # Agent editing of documents (Cloudflare Worker under wrangler dev). It joins
  # documents through sync-service and needs the Anthropic, Cerebras and
  # OpenAI keys from selfhost.conf [env]; it fails at startup without them.
  ai_editing_worker:
    <<: [*defaults, *env-file]
    image: ${MACRO_REGISTRY:-ghcr.io/olivierverhaegen}/macro-ai-editing:${MACRO_VERSION:?set to the image commit}
    environment:
      WRANGLER_SEND_METRICS: "false"
    networks:
      backend:
        aliases:
          - ai-editing-worker
    volumes:
      # Its D1 trace store.
      - ai_editing_state:/app/services/ai-editing-worker/.wrangler/state

  # PostHog and OTLP forwarding for the browser. It forwards only what the
  # bundle sends, and the bundle sends nothing without a PostHog key or a
  # browser OTLP endpoint; the OTLP targets are overridable.
  analytics_proxy:
    <<: *defaults
    image: ${MACRO_REGISTRY:-ghcr.io/olivierverhaegen}/macro-analytics:${MACRO_VERSION:?set to the image commit}
    environment:
      OTLP_TRACES_INTAKE_URL: ${OTLP_TRACES_INTAKE_URL:-http://otel-collector:4318/v1/traces}
      OTLP_LOGS_INTAKE_URL: ${OTLP_LOGS_INTAKE_URL:-http://otel-collector:4318/v1/logs}
      WRANGLER_SEND_METRICS: "false"
    networks:
      backend:
        aliases:
          - analytics-proxy

  # Plain SMTP from the services and FusionAuth, delivered to Zoho over
  # STARTTLS with the app password (mailrelay/mailrelay.py). Its env file holds
  # only that password, so the services never see it.
  mailrelay:
    <<: *defaults
    image: python:3.13-alpine3.22
    command: ["python", "/mailrelay/mailrelay.py"]
    env_file:
      - ${MACRO_SELFHOST_DIR:-/etc/macro}/mailrelay.env
    volumes:
      - ./mailrelay/mailrelay.py:/mailrelay/mailrelay.py:ro

  # The public entrance: the web bundle's Caddy image with proxy/Caddyfile and
  # a Let's Encrypt certificate for MACRO_DOMAIN.
  proxy:
    <<: *defaults
    image: ${MACRO_REGISTRY:-ghcr.io/olivierverhaegen}/macro-web:${MACRO_VERSION:?set to the image commit}
    environment:
      MACRO_DOMAIN: ${MACRO_DOMAIN:?set in the selfhost env file}
      ACME_EMAIL: ${ACME_EMAIL:?set in the selfhost env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  websocket_service:
    <<: *defaults
    image: ${MACRO_REGISTRY:-ghcr.io/olivierverhaegen}/macro-websocket:${MACRO_VERSION:?set to the image commit}
    networks:
      backend:
        aliases:
          - websocket-service

networks:
  backend:

volumes:
  postgres:
  redis:
  kafka:
  opensearch:
  fusionauth-db:
  fusionauth-config:
  sqs:
  dynamodb:
  kms:
  garage-meta:
  garage-data:
  sync_state:
  ai_editing_state:
  caddy_data:
  caddy_config:
