# SQS for the self-hosted stack. Queue URLs carry the gateway's address so
# they match the ones the generated env already uses.
include classpath("application.conf")

node-address {
  protocol = http
  host = localstack
  port = 4566
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = relaxed
}

rest-stats.enabled = false

aws {
  region = us-east-1
  accountId = 000000000000
}

# Queues are created by the provisioning step; keep them and their messages
# across restarts.
queues-storage {
  enabled = true
  path = "/data/queues.conf"
}

messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq"
}
