# Garage: the S3 store of the self-hosted stack (one node, one copy). Keys are
# flat, so an object and a longer key under it (`file/<id>` and
# `file/<id>/size=64`) coexist, as on S3. The RPC secret and the admin token
# come from the environment (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
metadata_auto_snapshot_interval = "6h"

replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "0.0.0.0:3900"

[admin]
api_bind_addr = "0.0.0.0:3903"
